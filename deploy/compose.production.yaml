name: poetryclub

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
      secrets:
        - production_env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:?EMAIL_TRANSPORT is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:3000"
    networks:
      - backend
      - ingress
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  bootstrap-admin:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    command: ["node", "scripts/bootstrap-admin.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true

  account-password-recovery:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    command: ["node", "scripts/reset-user-password.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RESET_USER_EMAIL: ${RESET_USER_EMAIL:-}
      RESET_USER_PASSWORD: ${RESET_USER_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  ingress:

secrets:
  production_env:
    file: ./.env.production
